name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dacom
          POSTGRES_PASSWORD: dacom
          POSTGRES_DB: dacom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dacom -d dacom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dacom:dacom@localhost:5432/dacom
      TEST_DATABASE_URL: postgresql://dacom:dacom@localhost:5432/dacom_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: "DACOM <ci@dacom.local>"
      APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - run: pnpm typecheck
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
